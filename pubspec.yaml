name: agora_chat_uikit
description: A set of ui components adapted to the chat sdk can quickly build a chat page
  and chat through the chat sdk by invoking the ui components.
version: 2.3.2
homepage: https://www.agora.io/

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

  agora_chat_sdk: 1.4.0
  chat_uikit_theme: 1.0.4

  chat_uikit_keyboard_panel: 0.1.2

  record: 6.1.1

  shared_preferences: 2.2.3

  path_provider: 2.1.4

  file_picker: ^10.1.2

  audioplayers: 6.0.0

  image_picker: ^1.2.0

  video_compress: 3.1.4

  video_player: 2.9.5

  flutter_localization: 0.2.0

  scroll_to_index: ^3.0.1

  cached_network_image: ^3.4.1

  html: ^0.15.4

dev_dependencies:
  flutter_lints: ^2.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.chat.uikit
        pluginClass: ChatUikitPlugin
      ios:
        pluginClass: ChatUikitPlugin

  assets:
    - assets/images/chat/
    - assets/images/chat/emojis/
    - assets/images/chatroom/
    - assets/images/chatroom/emojis/
